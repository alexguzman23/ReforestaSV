
{% extends 'arboles/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>
        <i class="bi bi-person-plus"></i>
        {% if form.instance.pk %}
            Editar Responsable
        {% else %}
            Registrar Responsable
        {% endif %}
    </h2>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label for="{{ form.nombre.id_for_label }}" class="form-label">
                    Nombre
                </label>
                {{ form.nombre }}
            </div>

            <div class="mb-3">
                <label for="{{ form.rol_asignado.id_for_label }}" class="form-label">
                    Rol Asignado
                </label>
                {{ form.rol_asignado }}
            </div>

            <div class="mb-3">
                <label for="{{ form.contacto.id_for_label }}" class="form-label">
                    Contacto
                </label>
                {{ form.contacto }}
            </div>

            <button type="submit" class="btn btn-success">
                <i class="bi bi-save"></i> Guardar
            </button>

            <a href="{% url 'responsable_list' %}" class="btn btn-secondary">
                <i class="bi bi-x-lg"></i> Cancelar
            </a>
        </form>
    </div>
</div>
{% endblock %}
