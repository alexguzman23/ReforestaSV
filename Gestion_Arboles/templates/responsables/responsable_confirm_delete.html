{% extends 'arboles/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-trash"></i> Eliminar Responsable</h2>
</div>

<div class="card shadow-sm">
    <div class="card-body">

        <div class="alert alert-danger">
            <i class="bi bi-exclamation-triangle-fill"></i>
            ¿Estás seguro de que deseas eliminar este responsable?
        </div>

        <p class="mb-4">
            Responsable:
            <strong>{{ responsable.nombre }}</strong>
        </p>

        <form method="post">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger">
                <i class="bi bi-trash"></i> Confirmar eliminación
            </button>

            <a href="{% url 'responsable_list' %}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Cancelar
            </a>
        </form>

    </div>
</div>
{% endblock %}
